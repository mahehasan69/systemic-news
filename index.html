<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SYSTEMIC NEWS</title>

<meta name="description"
content="AI Powered Global News">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="assets/css/style.css">

</head>

<body>

<header class="navbar">

<div class="container">

<a href="index.html"
class="logo">

SYSTEMIC
<span>NEWS</span>

</a>

<nav>

<a href="#">World</a>

<a href="#">Technology</a>

<a href="#">Business</a>

<a href="#">Science</a>

<a href="#">AI</a>

<a href="#">Cyber</a>

</nav>

<div class="actions">

<input
id="searchBox"
type="text"
placeholder="Search">

<button
id="themeButton">

🌙

</button>

</div>

</div>

</header>

<main>

<section class="hero">

<div class="container">

<div class="hero-card">

<img

id="heroImage"

src="assets/images/placeholder.jpg"

alt="Hero Image"

>

<div class="hero-content">

<div
id="heroCategory"
class="category">

Loading...

</div>

<h1
id="heroTitle">

Loading latest news...

</h1>

<p
id="heroSummary">

Please wait...

</p>

<a

id="heroLink"

href="#"

class="read-button">

Read Full Story →

</a>

</div>

</div>

</div>

</section>

<section class="latest">

<div class="container">

<div class="section-title">

<h2>

Latest News

</h2>

</div>

<div

id="newsGrid"

class="news-grid">

</div>

</div>

</section>

<section class="trending">

<div class="container">

<div class="section-title">

<h2>

Trending

</h2>

</div>

<div

id="trendingNews"

class="news-grid">

</div>

</div>

</section>

</main>

<footer>

<div class="container">

<p>

© 2026 SYSTEMIC NEWS

</p>

</div>

</footer>

<script src="assets/js/app.js"></script>

</body>
